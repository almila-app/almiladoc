name: gates

on:
  workflow_call:
    inputs:
      warm:
        description: Run on main to fill the gate caches; a job whose entry exists ends at once
        type: boolean
        default: false

permissions: {}

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  rust:
    name: rust
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: probe
        if: inputs.warm && github.ref == 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: true
          key: cargo-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'python/Cargo.toml', 'ocr-local/Cargo.toml', 'ocr-local/Cargo.lock', 'Makefile', '.github/workflows/gates.yml') }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug
      - if: steps.probe.outputs.cache-hit != 'true'
        run: rustup toolchain install
      - id: restore
        if: steps.probe.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cargo-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'python/Cargo.toml', 'ocr-local/Cargo.toml', 'ocr-local/Cargo.lock', 'Makefile', '.github/workflows/gates.yml') }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug
      - if: steps.probe.outputs.cache-hit != 'true'
        run: make fmt clippy test doc
      - if: inputs.warm && github.ref == 'refs/heads/main' && steps.probe.outputs.cache-hit != 'true' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.restore.outputs.cache-primary-key }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug

  rust-arm:
    name: rust-arm
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: probe
        if: inputs.warm && github.ref == 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: true
          key: cargo-rust-arm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'python/Cargo.toml', 'ocr-local/Cargo.toml', 'ocr-local/Cargo.lock', 'Makefile', '.github/workflows/gates.yml') }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug
      - if: steps.probe.outputs.cache-hit != 'true'
        run: rustup toolchain install
      - id: restore
        if: steps.probe.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cargo-rust-arm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'python/Cargo.toml', 'ocr-local/Cargo.toml', 'ocr-local/Cargo.lock', 'Makefile', '.github/workflows/gates.yml') }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug
      - if: steps.probe.outputs.cache-hit != 'true'
        run: make test
      - if: inputs.warm && github.ref == 'refs/heads/main' && steps.probe.outputs.cache-hit != 'true' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.restore.outputs.cache-primary-key }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug

  features:
    name: features
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: probe
        if: inputs.warm && github.ref == 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: true
          key: cargo-features-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'python/Cargo.toml', 'Makefile', '.github/workflows/gates.yml') }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug
      - if: steps.probe.outputs.cache-hit != 'true'
        run: rustup toolchain install
      - id: restore
        if: steps.probe.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cargo-features-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'python/Cargo.toml', 'Makefile', '.github/workflows/gates.yml') }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug
      - if: steps.probe.outputs.cache-hit != 'true'
        run: make features
      - if: inputs.warm && github.ref == 'refs/heads/main' && steps.probe.outputs.cache-hit != 'true' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.restore.outputs.cache-primary-key }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug

  python:
    name: python
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read # checkout
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: probe
        if: inputs.warm && github.ref == 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: true
          key: cargo-python-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'python/Cargo.toml', 'Makefile', '.github/workflows/gates.yml', 'pyproject.toml', 'uv.lock') }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/release
      - if: steps.probe.outputs.cache-hit != 'true'
        run: rustup toolchain install
      - if: steps.probe.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.6
          enable-cache: false
      - id: restore
        if: steps.probe.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cargo-python-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'python/Cargo.toml', 'Makefile', '.github/workflows/gates.yml', 'pyproject.toml', 'uv.lock') }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/release
      - if: steps.probe.outputs.cache-hit != 'true'
        run: make python
      - if: inputs.warm && github.ref == 'refs/heads/main' && steps.probe.outputs.cache-hit != 'true' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.restore.outputs.cache-primary-key }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/release

  policy:
    name: policy
    if: ${{ !inputs.warm }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read # checkout; zizmor resolves action refs with the run's token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.6
          enable-cache: false
      - run: make policy locks licences reuse hygiene
      - env:
          GH_TOKEN: ${{ github.token }}
        run: make actions

  dco:
    name: dco
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.6
          enable-cache: false
      - env:
          DCO_BASE: ${{ github.event.pull_request.base.sha }}
          DCO_HEAD: ${{ github.event.pull_request.head.sha }}
        run: make dco setup

  fuzz:
    name: fuzz
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: probe
        if: inputs.warm && github.ref == 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: true
          key: cargo-fuzz-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('fuzz/rust-toolchain.toml', 'fuzz/Cargo.lock', 'fuzz/Cargo.toml', 'Cargo.lock', 'Cargo.toml', 'python/Cargo.toml', 'Makefile', '.github/workflows/gates.yml') }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug
            fuzz/target
      - if: steps.probe.outputs.cache-hit != 'true'
        run: rustup toolchain install
        working-directory: fuzz
      - id: restore
        if: steps.probe.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cargo-fuzz-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('fuzz/rust-toolchain.toml', 'fuzz/Cargo.lock', 'fuzz/Cargo.toml', 'Cargo.lock', 'Cargo.toml', 'python/Cargo.toml', 'Makefile', '.github/workflows/gates.yml') }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug
            fuzz/target
      - if: steps.probe.outputs.cache-hit != 'true'
        run: make fuzz
      - if: inputs.warm && github.ref == 'refs/heads/main' && steps.probe.outputs.cache-hit != 'true' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.restore.outputs.cache-primary-key }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug
            fuzz/target

  required:
    name: required
    if: always() && !inputs.warm
    needs: [rust, rust-arm, features, python, policy, dco, fuzz]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "gates: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
