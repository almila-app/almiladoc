name: release

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "37 3 * * 2"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: 0

jobs:
  guard:
    name: guard
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read # checkout; the tag, its commit and the repository activity
      checks: read # ci / required on the tagged commit
    outputs:
      channel: ${{ steps.guard.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup toolchain install
      - run: make policy
      - run: python3 -I -B .github/scripts/release_guard.py --self-test
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          mkdir -p out
          python3 -I -B .github/scripts/release_guard.py guard --repository "$GITHUB_REPOSITORY" \
            ${TAG:+--tag "$TAG"} --notes out/notes.md --output "$GITHUB_OUTPUT"
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: out/notes.md
          if-no-files-found: error

  sdist:
    name: sdist
    needs: guard
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.6
          enable-cache: false
      - run: uv run --locked --only-group build -- maturin sdist --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  crate:
    name: crate
    needs: guard
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo package --locked -p almiladoc
      - run: |
          listing=$(tar -tzf target/package/almiladoc-*.crate)
          for entry in $(sed -n 's/^LICENCE_SET := //p' Makefile); do
            if ! grep -q "^almiladoc-[^/]*/$entry" <<< "$listing"; then echo "crate: $entry is missing"; exit 1; fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate
          path: target/package/almiladoc-*.crate
          if-no-files-found: error

  linux-x64:
    name: linux x64
    needs: sdist
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read # checkout
    env:
      ARCH: x86_64
      MANYLINUX: quay.io/pypa/manylinux_2_28_x86_64@sha256:e0adf18521ad35192df733a6c62d35df7801957d24e0470238aacecfab2188a3
      MUSLLINUX: quay.io/pypa/musllinux_1_2_x86_64@sha256:04e877afa939007f6784f9076d2aa797d1156f31281cfe19f203945d7b624970
    steps: &linux-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install
          rustup target add "$ARCH-unknown-linux-gnu" "$ARCH-unknown-linux-musl"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.6
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - run: |
          mkdir -p out wheels
          tar -xzf dist/almiladoc-*.tar.gz -C out
          cd out/almiladoc-*/
          for target in "manylinux_2_28 $ARCH-unknown-linux-gnu" "musllinux_1_2 $ARCH-unknown-linux-musl"; do
            read -r compatibility triple <<< "$target"
            uv run --project "$GITHUB_WORKSPACE" --locked --only-group build --only-group zig -- \
              maturin build --release --locked --zig --compatibility "$compatibility" --target "$triple" --out "$GITHUB_WORKSPACE/wheels"
          done
      - run: |
          uv export --locked --only-group test --prune mypy --no-emit-project --format requirements.txt -o out/test-requirements.txt
          for image in "$MANYLINUX manylinux_2_28" "$MUSLLINUX musllinux_1_2"; do
            read -r reference tag <<< "$image"
            docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" -w /src "$reference" \
              bash .github/scripts/release_smoke.sh wheels/almiladoc-*-"${tag}_$ARCH".whl dist/almiladoc-*.tar.gz out/test-requirements.txt
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ github.job }}
          path: wheels/*.whl
          if-no-files-found: error

  linux-arm64:
    name: linux arm64
    needs: sdist
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    permissions:
      contents: read # checkout
    env:
      ARCH: aarch64
      MANYLINUX: quay.io/pypa/manylinux_2_28_aarch64@sha256:a3e02308c822fb6ce0d12248b0c941817ba5e1a1bc9e7bb5929f29c50eaa40a9
      MUSLLINUX: quay.io/pypa/musllinux_1_2_aarch64@sha256:1db347533f8a7ea39aa20b0203f4e4af00630cdb621216a2b43771523c9983c5
    steps: *linux-steps

  macos-arm64:
    name: macos arm64
    needs: sdist
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read # checkout
    steps: &native-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.6
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - run: |
          mkdir -p out wheels
          tar -xzf dist/almiladoc-*.tar.gz -C out
          cd out/almiladoc-*/
          uv run --project "$GITHUB_WORKSPACE" --locked --only-group build -- \
            maturin build --release --locked --out "$GITHUB_WORKSPACE/wheels"
      - run: |
          uv export --locked --only-group test --prune mypy --no-emit-project --format requirements.txt -o out/test-requirements.txt
          uv python install $(sed -n 's/^PYTHONS ?= //p' Makefile)
          bash .github/scripts/release_smoke.sh wheels/*.whl dist/almiladoc-*.tar.gz out/test-requirements.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ github.job }}
          path: wheels/*.whl
          if-no-files-found: error

  macos-x64:
    name: macos x64
    needs: sdist
    runs-on: macos-26-intel
    timeout-minutes: 60
    permissions:
      contents: read # checkout
    steps: *native-steps

  windows-x64:
    name: windows x64
    needs: sdist
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read # checkout
    steps: *native-steps

  windows-arm64:
    name: windows arm64
    needs: sdist
    runs-on: windows-11-arm
    timeout-minutes: 60
    permissions:
      contents: read # checkout
    steps: *native-steps

  attest:
    name: attest
    if: github.event_name == 'push'
    needs: [guard, sdist, crate, linux-x64, linux-arm64, macos-arm64, macos-x64, windows-x64, windows-arm64]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      id-token: write # the Sigstore certificate of the attestation
      attestations: write # the attestation of every file
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{sdist,crate,wheels-*}"
          path: dist
          merge-multiple: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

  publish-testpypi:
    name: publish testpypi
    if: github.event_name == 'push' && needs.guard.outputs.channel == 'testpypi'
    needs: [guard, attest]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/project/almiladoc/
    permissions:
      id-token: write # trusted publishing and its PEP 740 attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{sdist,wheels-*}"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist

  publish-pypi:
    name: publish pypi
    if: github.event_name == 'push' && needs.guard.outputs.channel == 'pypi'
    needs: [guard, attest]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/almiladoc/
    permissions:
      id-token: write # trusted publishing and its PEP 740 attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{sdist,wheels-*}"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist

  publish-crates:
    name: publish crates
    if: github.event_name == 'push' && needs.guard.outputs.channel == 'pypi'
    needs: [guard, publish-pypi]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment:
      name: crates-io
      url: https://crates.io/crates/almiladoc
    permissions:
      contents: read # checkout
      id-token: write # the trusted-publishing token exchange
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - id: bootstrap
        env:
          PUBLISH_NEW: ${{ secrets.CRATES_IO_PUBLISH_NEW_TOKEN }}
        run: echo "token=${PUBLISH_NEW:+present}" >> "$GITHUB_OUTPUT"
      - id: exchange
        if: steps.bootstrap.outputs.token != 'present'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - env:
          CARGO_REGISTRY_TOKEN: ${{ steps.exchange.outputs.token || secrets.CRATES_IO_PUBLISH_NEW_TOKEN }}
        run: cargo publish --locked -p almiladoc

  verify-published:
    name: verify published
    if: ${{ !cancelled() && github.event_name == 'push' && (needs.publish-testpypi.result == 'success' || needs.publish-crates.result == 'success') }}
    needs: [guard, publish-testpypi, publish-crates]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read # checkout
      attestations: read # the attestation of every file
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{sdist,crate,wheels-*}"
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in dist/*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$GITHUB_SHA"
          done
      - env:
          CHANNEL: ${{ needs.guard.outputs.channel }}
        run: |
          python3 -I -B .github/scripts/release_guard.py verify-published --repository "$GITHUB_REPOSITORY" \
            --channel "$CHANNEL" --dist dist --run-id "$GITHUB_RUN_ID" --commit "$GITHUB_SHA"

  github-release:
    name: github release
    if: ${{ !cancelled() && github.event_name == 'push' && needs.verify-published.result == 'success' }}
    needs: [guard, verify-published]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write # the release and its assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{sdist,crate,wheels-*}"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: notes
      - env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.guard.outputs.channel }}
        run: |
          (cd dist && sha256sum -- *) > SHA256SUMS
          prerelease=()
          if [ "$CHANNEL" = testpypi ]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes/notes.md "${prerelease[@]}"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" dist/* SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
