name: scheduled

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  staleness:
    name: staleness
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -I -B .github/scripts/staleness.py --self-test
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B .github/scripts/staleness.py
