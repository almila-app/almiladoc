name: cache

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  warm:
    name: warm
    permissions:
      contents: read # checkout in every gate
    uses: $/.github/workflows/gates.yml
    with:
      warm: true
