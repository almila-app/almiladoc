[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

[bans]
multiple-versions = "allow"
deny = [
    { crate = "ureq", wrappers = ["almiladoc"], reason = "only the ocr-http feature makes a network call" },
    { crate = "hyper", reason = "the default build makes no network call" },
    { crate = "reqwest", reason = "the default build makes no network call" },
    { crate = "libloading", reason = "the default build loads no library at run time" },
    { crate = "rten", reason = "local OCR is opt-in" },
    { crate = "oar-ocr", reason = "local OCR lives in its separate crate" },
    { crate = "oar-ocr-core", reason = "local OCR lives in its separate crate" },
    { crate = "ort", reason = "local OCR lives in its separate crate" },
    { crate = "ort-sys", reason = "local OCR lives in its separate crate" },
]
