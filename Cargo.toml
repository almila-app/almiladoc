[workspace]
members = ["python"]
# cargo-fuzz keeps its own lockfile and nightly-only dependencies.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "FSL-1.1-MIT AND MIT"
repository = "https://github.com/almila-app/almiladoc"

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "almiladoc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Convert documents (doc, docx, odt, rtf, epub, pdf, presentations, spreadsheets, csv) to GitHub-Flavored Markdown"
readme = "README.md"
keywords = ["markdown", "docx", "pdf", "converter", "document"]
categories = ["parser-implementations", "text-processing"]
include = ["/src", "/README.md", "/LICENSE", "/LICENSES", "/NOTICE", "/REUSE.toml", "/THIRD-PARTY-LICENSES"]

[lints]
workspace = true

[dev-dependencies]
insta = "1"
sha2 = "0.11"

[dependencies]
cfb = "0.15.0"
csv = "1.4.0"
flate2 = "1"
encoding_rs = "0.8.35"
log = "0.4"
pdf-inspector = "1.14.2"
quick-xml = "0.42.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = "symbols"
