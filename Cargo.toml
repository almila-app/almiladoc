[workspace]
members = ["python"]
# cargo-fuzz keeps its own lockfile and nightly-only dependencies.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "FSL-1.1-MIT AND MIT"
repository = "https://github.com/almila-app/almiladoc"

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "almiladoc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Convert documents (doc, docx, odt, rtf, epub, pdf, presentations, spreadsheets, csv) to GitHub-Flavored Markdown"
readme = "README.md"
keywords = ["markdown", "docx", "pdf", "converter", "document"]
categories = ["parser-implementations", "text-processing"]
include = ["/src", "/README.md", "/LICENSE", "/LICENSES", "/NOTICE", "/REUSE.toml", "/THIRD-PARTY-LICENSES"]

[lints]
workspace = true

[dev-dependencies]
insta = "1.49.0"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[dependencies]
cfb = "0.15.0"
csv = "1.4.0"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
encoding_rs = "0.8.35"
pdf-inspector = { version = "1.25.2", optional = true }
quick-xml = { version = "0.42.0", features = ["escape-html"] }
rayon = "1.12.0"
sha2 = "0.11.0"
thiserror = "2.0.21"
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[features]
default = ["pdf"]
pdf = ["dep:pdf-inspector"]

[profile.release]
lto = "thin"
strip = "symbols"
