[package]
name = "almiladoc-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "FSL-1.1-MIT AND MIT"

[package.metadata]
cargo-fuzz = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
disallowed_methods = "allow"
disallowed_types = "allow"

[dependencies]
libfuzzer-sys = "0.4.13"
almiladoc = { path = "..", features = ["serde"] }
cfb = "0.15.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[[bin]]
name = "docx"
path = "fuzz_targets/docx.rs"
test = false
doc = false

