[package]
name = "almiladoc-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Python binding for almiladoc"
publish = false

[lib]
name = "_almiladoc"
crate-type = ["cdylib"]
test = false
doctest = false

[lints]
workspace = true

[dependencies]
almiladoc = { path = "..", features = ["serde"] }
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
