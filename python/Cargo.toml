[package]
name = "almiladoc-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Python binding for almiladoc"
publish = false

[lib]
name = "_almiladoc"
crate-type = ["cdylib"]
test = false
doctest = false

[lints]
workspace = true

[dependencies]
almiladoc = { path = "..", features = ["ocr-http", "serde"] }
# Compiles out every log record, ureq's trace of each request's key included.
log = { version = "0.4.34", features = ["max_level_off"] }
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
serde_json = "1.0.154"
